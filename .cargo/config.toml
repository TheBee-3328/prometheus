# Nightly-only size pass: rebuild libstd with panic_abort / immediate-abort so
# .eh_frame collapses. Requires fenix nightly + rust-src from flake.nix.
#
# Explicit host target is required for build-std. flake.nix wraps `cargo` so
# release bins are also copied to target/release/ (where judge.sh looks).

[build]
target = "x86_64-unknown-linux-gnu"

[unstable]
build-std = ["std", "panic_abort"]

[target.x86_64-unknown-linux-gnu]
rustflags = [
    "-Zunstable-options",
    "-Cpanic=immediate-abort",
    "-Zlocation-detail=none",
    "-Cforce-unwind-tables=no",
]
