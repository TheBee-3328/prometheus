[workspace]
resolver = "2"
members = [
    "crates/prometheus-core",
    "crates/prometheus-compress",
    "crates/prometheus-decompress",
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

# Fast rebuilds for parameter search (not used by judge).
[profile.tune]
inherits = "release"
lto = false
codegen-units = 16
opt-level = 3
strip = false
panic = "abort"
