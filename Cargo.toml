cargo-features = ["panic-immediate-abort"]

[workspace]
resolver = "2"
members = [
    "crates/prometheus-core",
    "crates/prometheus-compress",
    "crates/prometheus-decompress",
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "immediate-abort"
strip = "symbols"

[profile.tune]
inherits = "release"
lto = false
codegen-units = 16
opt-level = 3
strip = false
panic = "immediate-abort"
